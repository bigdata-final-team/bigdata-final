name: CI

on:
  push:
    branches: [main]
  pull_request:

# 워크플로 토큰은 저장소를 읽기만 한다
permissions:
  contents: read

jobs:
  # 필수 체크. .py와 .ipynb의 미사용 import, 정의 안 된 변수, 문법 오류를 잡는다.
  # 고치는 법: ruff check --fix .  (CONTRIBUTING.md "코드 검사")
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6  # v3.6.1
        with:
          version-file: requirements.txt  # 로컬과 같은 ruff 버전으로 검사

  # 필수 체크는 이 잡이 아니라 SonarCloud가 PR에 올리는 "SonarCloud Code Analysis"다
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 새 코드 판정(blame)에 전체 이력이 필요
      - uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703  # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
