name: autofix

# PR 브랜치에 ruff의 기계적 수정(lint --fix, format)을 자동 커밋한다.
# 검사만 하는 ci.yml의 lint 잡과 별개로 동작한다.
on:
  pull_request:
    paths:
      - "**.py"
      - "**.ipynb"
      - "pyproject.toml"
      - ".github/workflows/autofix.yml"

# 같은 PR에 연속 push하면 이전 실행은 취소한다
concurrency:
  group: autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ruff-fix:
    # fork PR은 토큰이 읽기 전용이라 push할 수 없다
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      # 안전한 수정만 적용한다 (unsafe fix는 동작이 바뀔 수 있어 제외)
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6  # v3.6.1, .py와 .ipynb 모두
        with:
          args: check --fix
        continue-on-error: true  # 자동으로 못 고치는 규칙 위반이 남아도 format과 커밋은 진행. 최종 판정은 ci.yml lint 잡
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6  # v3.6.1
        with:
          args: format
      # org의 Actions 허용 목록 밖의 서드파티 액션은 쓸 수 없어 git 명령으로 직접 커밋한다
      - name: 변경분이 있으면 커밋하고 push
        run: |
          if git diff --quiet; then
            echo "수정할 것 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: ruff auto-fix"
          git push
