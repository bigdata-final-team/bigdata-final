name: autofix

# PR에서 ruff의 기계적 수정(lint --fix, format)을 .py/.ipynb에만 자동 커밋한다.
# 자동 수정 커밋이 생기면 `autofix-review` 라벨이 붙고, 사람이 diff를 확인한 뒤
# 라벨을 직접 떼기 전까지 autofix-review 체크가 실패한다. 문서(.md 등)는 건드리지 않는다.
# (Free 플랜 private repo라 브랜치 보호로 머지를 강제 차단할 수 없다. 빨간 체크가 최대한의 장치다.)
on:
  pull_request:
    # paths 필터를 두지 않는다: autofix-review가 필수 체크라서 모든 PR에서 실행돼야 한다
    # (문서만 고친 PR은 ruff가 할 일이 없어 바로 끝나고, 게이트는 통과한다)
    types: [opened, synchronize, reopened, labeled, unlabeled]

# 같은 PR에 연속 push하면 이전 실행은 취소한다
concurrency:
  group: autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# 최상위에는 권한을 주지 않고, 필요한 잡에만 준다 (SonarQube: write 권한은 잡 단위로)
permissions: {}

env:
  REVIEW_LABEL: autofix-review

jobs:
  ruff-fix:
    # 라벨 변경에는 수정하지 않는다. fork PR은 토큰이 읽기 전용이라 push할 수 없다
    if: >-
      github.event.action != 'labeled' && github.event.action != 'unlabeled'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 수정 커밋 push
      pull-requests: write   # 라벨과 코멘트
      issues: write           # 저장소 라벨 생성
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      # 안전한 수정만 적용한다 (unsafe fix는 동작이 바뀔 수 있어 제외)
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6  # v3.6.1, .py와 .ipynb 모두
        with:
          args: check --fix
        continue-on-error: true  # 자동으로 못 고치는 규칙 위반이 남아도 format과 커밋은 진행. 최종 판정은 ci.yml lint 잡
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6  # v3.6.1
        with:
          args: format
      # org의 Actions 허용 목록 밖의 서드파티 액션은 쓸 수 없어 git 명령으로 직접 커밋한다
      - name: 코드 변경분만 커밋하고 확인 요청
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # 문서 등 다른 파일이 바뀌었더라도 .py/.ipynb만 스테이징한다
          # (매칭 파일이 없는 패턴을 git add에 직접 주면 에러라서 변경된 목록을 먼저 뽑는다)
          git diff --name-only -z -- '*.py' '*.ipynb' | xargs -0 -r git add --
          if git diff --cached --quiet; then
            echo "수정할 것 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: ruff auto-fix"
          git push
          sha=$(git rev-parse --short HEAD)
          gh label create "$REVIEW_LABEL" --force \
            --description "자동 수정 커밋을 사람이 확인해야 함. 확인 후 이 라벨을 직접 제거" --color FBCA04
          gh pr edit "$PR" --add-label "$REVIEW_LABEL"
          gh pr comment "$PR" --body "자동 수정 커밋 \`$sha\`이 올라갔습니다. **Files changed**에서 diff를 확인한 뒤 \`$REVIEW_LABEL\` 라벨을 직접 제거하세요. 제거 전까지 \`autofix-review\` 체크는 실패합니다."

  # 사람이 라벨을 떼기 전까지 실패하는 게이트. 라벨 변경 때도 다시 돌아 결과가 갱신된다
  autofix-review:
    needs: ruff-fix
    # 항상 실행한다. 스킵된 잡은 필수 체크에서 성공으로 취급되므로, ruff-fix가 실패해도 게이트를 건너뛰면
    # 확인 안 된 봇 커밋이 통과할 수 있다 (ruff-fix가 정상적으로 스킵되는 라벨 이벤트, fork PR은 통과)
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read  # 라벨 조회만
    steps:
      - name: 자동 수정 잡이 실패했으면 게이트도 실패
        if: needs.ruff-fix.result == 'failure' || needs.ruff-fix.result == 'cancelled'
        run: |
          echo "::error::자동 수정 잡이 ${{ needs.ruff-fix.result }} 상태라 확인 여부를 판단할 수 없습니다. 실행 로그를 확인하세요."
          exit 1
      - name: 확인 대기 라벨이 남아 있으면 실패
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh pr view "$PR" --repo "${{ github.repository }}" --json labels --jq '.labels[].name')
          if printf '%s\n' "$labels" | grep -qx "$REVIEW_LABEL"; then
            echo "::error::자동 수정 커밋을 확인한 뒤 '$REVIEW_LABEL' 라벨을 제거하세요."
            exit 1
          fi
          echo "확인 대기 중인 자동 수정 없음"
