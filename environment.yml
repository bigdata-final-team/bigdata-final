# conda env 정의. 처음 한 번: conda env create -f environment.yml
# 고친 뒤 반영: conda env update -n bigdata-final -f environment.yml --prune
# 버전은 requirements.txt와 똑같이 맞춘다. check_env.py가 requirements.txt 기준으로 설치 버전을 확인하고,
# CI(lint 잡)는 requirements.txt의 ruff 버전을 읽는다. 하나를 바꾸면 다른 하나도 같이 바꾼다.
# 예외: conda 전용인 libblas 한 줄은 requirements.txt에 없다 (아래 '데이터 처리' 주석).
name: bigdata-final
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip

  # 데이터 처리
  # numpy·scipy의 BLAS는 OpenBLAS로 고정한다. Windows에서 기본으로 깔리는 MKL(2026.1)은 OpenMP로
  # llvm-openmp의 libiomp5md.dll을 쓰는데, 이 DLL은 모든 함수를 libomp.dll로 넘기기만 한다. env를
  # 활성화하지 않고 python.exe를 바로 실행하면(Jupyter 커널이 이렇게 뜬다) libomp.dll을 못 찾아
  # np.dot 한 번에 프로세스가 죽는다(0xC06D007F). matplotlib 그림도 np.dot을 거쳐 그래프 셀마다 커널이 죽는다.
  # libblas는 BLAS 종류를 고르는 conda 전용 패키지라 pip에는 없고, PyPI numpy·scipy 휠은 원래 OpenBLAS를
  # 넣어 배포하므로 requirements.txt에는 적지 않는다 (적으면 check_env.py가 '없음'으로 보고한다).
  - libblas=*=*openblas
  - numpy=2.5.5
  - pandas=3.1.1
  - polars=2.1.0
  - pyarrow=26.0.1

  # 통계
  - scipy=1.18.1
  - statsmodels=0.15.0

  # 기계학습
  - scikit-learn=1.9.1
  - xgboost=3.4.1
  - lightgbm=4.7.0

  # 시계열 예측
  - prophet=1.5.0

  # 시각화
  - matplotlib=3.11.2
  - seaborn=0.13.2
  - plotly=7.1.0

  # 노트북·엑셀
  - jupyterlab=4.6.6
  - ipykernel=7.4.0
  - openpyxl=3.1.5

  # 코드 검사 (ruff는 CI와 같은 버전, mypy는 선택)
  - ruff=0.17.5
  - mypy=2.4.1
  - pandas-stubs=3.1.0.261029
  - types-seaborn=0.13.2.20240417
